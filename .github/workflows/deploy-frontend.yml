# ==============================================================================
# Continuous Deployment - Frontend Angular vers GitHub Pages
# ==============================================================================
# Déclenché uniquement sur push vers master, develop ET si des fichiers frontend ont changé.
# Utilise les actions officielles GitHub Pages (recommandé en 2026).
# ==============================================================================

name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [master ,develop]
  pull_request:
    branches: [master, develop]
  #workflow_dispatch:    Permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # Détection des changements (même logique que dans ci.yml)
  # --------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - './src/front/web-client'
              - '.github/workflows/deploy-frontend.yml'

  # --------------------------------------------------------------------------
  # Build du frontend
  # --------------------------------------------------------------------------
  build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build -- --configuration production --base-href /${{ github.event.repository.name}}/
    
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/${{ github.event.repository.name }}/browser

  # --------------------------------------------------------------------------
  # Déploiement sur GitHub Pages
  # --------------------------------------------------------------------------
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
