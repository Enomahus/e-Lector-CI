# ==============================================================================
# Continuous Deployment - Backend .NET : Build & Push Docker vers GHCR
# ==============================================================================
# GitHub Container Registry (ghcr.io) = gratuit + intégré + utilise GITHUB_TOKEN
# Déclenché uniquement sur push vers main ET si backend a changé.
# ==============================================================================

name: Build & Push Backend Docker Image

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [master, develop]
  #workflow_dispatch:

permissions:
  contents: read
  packages: write     # Obligatoire pour pousser vers GHCR

jobs:
  # --------------------------------------------------------------------------
  # Détection des changements
  # --------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - './src/back/src/Backend/00-Web'
              - '.github/workflows/docker-backend.yml'

  # --------------------------------------------------------------------------
  # Build + Push Docker
  # --------------------------------------------------------------------------
  build-and-push:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Docker Buildx (recommandé pour le cache et multi-arch futur)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authentification automatique vers GHCR avec le token GitHub
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Génère des tags intelligents : latest + sha court
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend   # Nom de l'image
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Build et push avec cache GitHub Actions (très rapide après le 1er run)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/back                    # Dossier contenant le Dockerfile
          file: ./src/back/src/Backend/00-Web/Dockerfile            # Ajuste si ton Dockerfile est ailleurs
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optionnel : Afficher les tags poussés
      - name: Image pushed successfully
        run: |
          echo "✅ Image pushed to GHCR:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Pour puller localement :"
          echo "docker pull ghcr.io/${{ github.repository }}/backend:sha-${{ github.sha }}"
