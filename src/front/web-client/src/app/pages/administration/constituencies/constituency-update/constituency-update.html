@if (isLoading()) {
  <app-loader></app-loader>
} @else {
  <h1 class="constituency-name">{{ constituency()?.wording }}</h1>
  <app-constituency
    [constituency]="constituency()"
    [constituencyId]="constituencyId()"
    [isSaving]="isSaving()"
    [isToCreate]="false"
    (saveConstituency)="submitedForm($event)"
    (goBack)="navigateToConstituencies()"
  ></app-constituency>
}
