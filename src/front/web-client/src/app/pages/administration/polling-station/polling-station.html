<div class="form-container">
  <h2>Création d'un Bureau de Vote</h2>

  <form (submit)="onSubmit()">
    <!-- <div class="field">
      <label>Département</label>
      <select [formField]="pollingStationForm.constituencyId">
        <option [ngValue]="null">Sélectionnez un département</option>
        @for (dept of departments(); track dept.id) {
          <option [ngValue]="dept.id">{{ dept.name }}</option>
        }
      </select>
    </div> -->

    <div class="field">
      <label for="name">Nom du Lieu de Vote (EPV, Ecole, etc.)</label>
      <input
        id="name"
        type="text"
        [formField]="pollingStationForm.wording"
        placeholder="ex: EPV KAUNAN 1"
      />
    </div>

    <div class="field">
      <label for="pollingStationNumber">Numéro du Bureau</label>
      <input
        id="pollingStationNumber"
        type="number"
        [formField]="pollingStationForm.stationNumber"
      />
    </div>

    <button type="submit" [disabled]="pollingStationForm().invalid()" class="btn primary">
      Enregistrer le Bureau
    </button>
  </form>
</div>
