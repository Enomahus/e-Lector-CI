@if (isLoading()) {
  <app-loader></app-loader>
} @else {
  <h1 class="station-name">{{ pollingStation()?.wording }}</h1>
  <div class="polling-station-update">
    <app-polling-station
      [form]="form()"
      [isSaving]="isSaving()"
      [constituencyId]="constituencyId()"
      [isToCreate]="false"
      (save)="updatePollingStation($event)"
      (goBack)="navigateToPollingStations()"
    ></app-polling-station>
  </div>
}
