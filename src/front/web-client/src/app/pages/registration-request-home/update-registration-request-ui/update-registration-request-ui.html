@if (registrationRequest()) {
  <h1>{{ 'registrationRequest.editRegistrationRequestTitle' | translate }}</h1>
  <app-registration-request-ui
    [isSaving]="isSaving()"
    [isCreateMode]="false"
    [selectedStatus]="selectedStatus()!"
    [registrationRequest]="registrationRequest()"
    (saveTriggered)="update($event)"
    (goBack)="goBack()"
  ></app-registration-request-ui>
} @else {
  <app-loader></app-loader>
}
