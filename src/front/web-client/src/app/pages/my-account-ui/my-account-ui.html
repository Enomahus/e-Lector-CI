<h1 class="title-my-account">{{ 'users.myInformations' | translate }}</h1>
@if (!isLoading()) {
  <app-user-form
    [isSaving]="isSaving()"
    [constituencyId]="constituencyId()"
    [isEditMode]="true"
    [form]="form"
    (formSubmitted)="updateMyAccountInformations($event)"
    (goBack)="reloadUi()"
  >
  </app-user-form>
} @else {
  <app-loader></app-loader>
}
