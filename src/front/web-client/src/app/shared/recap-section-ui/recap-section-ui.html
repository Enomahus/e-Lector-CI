<div class="rounded-2xl border {{ color() }} overflow-hidden">
  <div class="flex items-center justify-between px-5 py-3 bg-white/60">
    <div class="flex items-center gap-2">
      <ng-content select="[icon]"></ng-content>
      <span class="text-sm font-bold text-slate-700">{{ title() }}</span>
    </div>

    <button
      type="button"
      (click)="edit.emit(step())"
      class="flex items-center gap-1 text-xs font-semibold text-indigo-600 hover:text-indigo-700 transition-colors px-2.5 py-1 rounded-lg hover:bg-indigo-50"
      [attr.aria-label]="'Modifier ' + title()"
    >
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
        />
      </svg>
      Modifier
    </button>
  </div>

  <div class="px-5 pb-4 pt-3 grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-2 bg-white/40">
    @for (item of filteredItems(); track item.label) {
      <div class="flex flex-col gap-0.5">
        <span class="text-xs text-slate-400">{{ item.label }}</span>
        <span class="text-sm font-medium text-slate-700">
          @if (isBoolean(item.value)) {
            {{ item.value ? 'Oui' : 'Non' }}
          } @else {
            {{ item.value }}
          }
        </span>
      </div>
    }
  </div>
</div>
